<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <title>Rust + Wasm</title>
</head>

<body>
  <p id="result">読み込み中…</p>

  <script type="module">
    import init, { greet } from "./pkg/tiny_exp.js";

    const result = document.getElementById("result");

    try {
      await init();
      result.textContent = greet("世界");
    } catch (error) {
      result.textContent = "Wasmの読み込みに失敗しました";
      console.error(error);
    }
  </script>
</body>

</html>
